name: lint

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  unused-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Pinned to match .pre-commit-config.yaml so local and CI agree.
      - name: Check for unused imports (ruff F401)
        run: uvx ruff@0.14.4 check --select F401 src/ tests/
