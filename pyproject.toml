[project]
name = "yeast-seq2epxression-benchmark"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy",
    "pandas>=3.0.2",
    "pyfonts>=1.3.0",
    "pypalettes>=0.2.1",
    "pysam>=0.23.3",
    "pyyaml>=6.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "tqdm>=4.67.3",
    "typer>=0.12",
]

[project.scripts]
ybench = "yeastbench.cli:app"

[project.optional-dependencies]
shorkie = [
    "h5py",
    "torch>=2.11.0",
]
yorzoi = [
    "yorzoi==0.2.1",
]
dream_rnn = [
    "torch>=2.11.0",
]
data = [
    "huggingface_hub>=0.25",
]
all = [
    "yeast-seq2epxression-benchmark[shorkie,yorzoi,dream_rnn,data]",
]
dev = [
    "ipykernel>=7.2.0",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.14.4",
]
modal = [
    "modal>=1.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yeastbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: requires internet egress (skipped offline)",
    "integration: end-to-end, needs the published mirror (opt-in)",
    "gpu: needs a GPU + model extras (shorkie/yorzoi)",
]
